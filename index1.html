<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9e9f5">
  <title>莱茨狗 · IP角色宇宙</title>
  <style>
    :root { color-scheme: light; --ink:#fff; --pink:#ffe7f6; --muted:rgba(255,255,255,.66); }
    * { box-sizing:border-box }
    html,body { width:100%; min-height:100%; margin:0 }
    body { font-family: Inter,"PingFang SC","Microsoft YaHei",sans-serif; background:#d8c5ed; }
    .hero { position:relative; display:grid; grid-template-columns:minmax(340px, 42%) 1fr; min-height:100svh; overflow:hidden; isolation:isolate; color:var(--ink); background:#e7c9ea; }
    .hero::before { content:""; position:absolute; inset:0; z-index:-2; background:url("横屏海报图2.png") center 48% / cover no-repeat; transform:scale(1.015); opacity:1; animation:background-warp 3600ms cubic-bezier(.4,0,.2,1) both; will-change:transform,opacity; }
    .hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(60,38,91,.48),rgba(74,48,104,.18) 44%,rgba(69,48,93,.02) 78%),linear-gradient(0deg,rgba(74,47,90,.22),transparent 30%,rgba(255,236,251,.06)); }
    .background-soft { position:absolute; z-index:-1; inset:0; background:url("横屏海报图2.png") center 48% / cover no-repeat; transform:scale(1.24); filter:blur(12px); opacity:1; animation:soft-exit 3600ms cubic-bezier(.4,0,.2,1) both; will-change:transform,opacity; pointer-events:none; }
    .topbar { position:absolute; z-index:2; top:0; left:0; right:0; height:86px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(22px,5.3vw,88px); border-bottom:1px solid rgba(255,255,255,.23); }
    .brand { display:flex; align-items:center; gap:12px; font-size:13px; letter-spacing:.24em; font-weight:600; text-shadow:0 1px 12px #967aac; }
    .brand-logo { display:block; width:148px; height:54px; object-fit:contain; animation:brand-arrive 980ms cubic-bezier(.2,.82,.22,1) 80ms both; }
    .brand-icon { display:block; width:76px; height:58px; object-fit:contain; filter:drop-shadow(0 2px 7px rgba(80,53,91,.12)); animation:mascot-arrive 1080ms cubic-bezier(.18,.9,.25,1) 170ms both; }
    .top-note { font-family:"Source Han Sans CN","Source Han Sans SC","思源黑体","Noto Sans CJK SC",sans-serif; font-size:14px; font-weight:700; letter-spacing:.14em; color:rgba(255,255,255,.92); animation:note-arrive 880ms cubic-bezier(.2,.82,.22,1) 240ms both; }
    .nav-panel { position:relative; isolation:isolate; min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:100px 16px 90px calc(clamp(24px,5.3vw,88px) + 28px); font-family:"Source Han Sans CN","Source Han Sans SC","思源黑体","Noto Sans CJK SC",sans-serif; font-weight:700; }
    .eyebrow { position:relative; z-index:1; margin:0 0 38px 3px; font-size:12px; line-height:1.9; letter-spacing:.12em; color:rgba(255,255,255,.82); font-weight:700; animation:copy-arrive 980ms cubic-bezier(.2,.82,.22,1) 360ms both; }
    .wheel { position:relative; z-index:1; width:100%; height:min(74vh,680px); min-height:500px; outline:none; touch-action:none; user-select:none; cursor:grab; }
    .wheel.dragging { cursor:grabbing }
    .option { position:absolute; top:50%; left:-15px; isolation:isolate; display:flex; align-items:center; min-height:74px; padding:10px 15px; border-radius:38px; white-space:nowrap; color:rgba(255,255,255,.58); font-size:clamp(32px,3.05vw,49px); font-weight:700; letter-spacing:.06em; line-height:1; transform-origin:left center; transition:color .25s,font-weight .25s; cursor:pointer; text-shadow:0 1px 18px rgba(71,47,90,.3); }
    .option::before { content:""; position:absolute; z-index:-1; inset:0; border:1.5px solid rgba(255,255,255,.62); border-radius:38px; background:radial-gradient(ellipse at 24% 9%,rgba(255,255,255,.68) 0%,rgba(255,255,255,.26) 7%,transparent 27%),radial-gradient(ellipse at 78% 116%,rgba(224,239,255,.18) 0%,transparent 55%),linear-gradient(145deg,rgba(255,255,255,.105),rgba(231,244,255,.018) 48%,rgba(255,255,255,.075)); -webkit-backdrop-filter:url(#liquid-lens) saturate(1.7) brightness(1.08); backdrop-filter:url(#liquid-lens) saturate(1.7) brightness(1.08); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.94),inset 0 -1px 1px rgba(32,47,81,.18),inset 4px 0 12px rgba(225,239,255,.1),inset -4px 0 12px rgba(255,255,255,.08),0 0 6px rgba(255,255,255,.16),0 5px 18px rgba(67,43,89,.055); opacity:.86; transition:opacity .25s,border-color .25s,background .25s; }
    .option::after { content:""; position:absolute; z-index:2; inset:-3px; border:2px solid transparent; border-radius:42px; pointer-events:none; background:linear-gradient(transparent,transparent) padding-box,radial-gradient(92px circle at var(--pointer-x,50%) var(--pointer-y,50%),#fffdf7 0%,rgba(255,252,242,.98) 18%,rgba(255,248,229,.74) 42%,rgba(255,247,232,.12) 72%,transparent 100%) border-box; filter:drop-shadow(0 0 7px rgba(255,250,239,.98)) drop-shadow(0 0 18px rgba(255,250,239,.8)) drop-shadow(0 0 32px rgba(255,248,231,.55)); opacity:var(--glow-strength,0); transition:opacity .12s ease-out; }
    .option.active { color:#fff; font-weight:700; text-shadow:0 2px 24px rgba(83,51,104,.48); }
    .option.active::before { opacity:1; border-color:rgba(255,255,255,.88); background:radial-gradient(ellipse at 24% 9%,rgba(255,255,255,.82) 0%,rgba(255,255,255,.34) 7%,transparent 27%),radial-gradient(ellipse at 78% 116%,rgba(224,239,255,.24) 0%,transparent 55%),linear-gradient(145deg,rgba(255,255,255,.15),rgba(231,244,255,.035) 48%,rgba(255,255,255,.12)); box-shadow:inset 0 1.5px 0 #fff,inset 0 -1px 1px rgba(32,47,81,.2),inset 4px 0 13px rgba(225,239,255,.14),inset -4px 0 13px rgba(255,255,255,.1),0 0 8px rgba(255,255,255,.22),0 7px 24px rgba(67,43,89,.09); }
    .option.active::after { opacity:var(--glow-strength,0); }
    .option.glowing { filter:blur(0)!important; }
    .nav-foot { position:relative; z-index:1; margin:26px 0 0 3px; display:flex; align-items:center; gap:12px; color:rgba(255,255,255,.85); font-size:11px; letter-spacing:.18em; font-weight:700; animation:copy-arrive 900ms cubic-bezier(.2,.82,.22,1) 1120ms both; }
    .nav-foot::before { content:""; display:block; width:28px;height:1px;background:rgba(255,255,255,.75); }
    .hero-copy { display:none; }
    .scroll-hint { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; font-size:9px; letter-spacing:.28em; color:rgba(255,255,255,.8); }
    .scroll-hint span { width:1px;height:25px;background:linear-gradient(#fff,transparent); }
    html.has-user-cursor,html.has-user-cursor * { cursor:none!important; }
    .user-cursor-layer { position:fixed;inset:0;z-index:50;pointer-events:none;visibility:hidden; }
    .user-cursor-layer.is-visible { visibility:visible; }
    .user-cursor-arrow-anchor { position:fixed;left:0;top:0;width:0;height:0;transform:translate3d(var(--cursor-x,-40px),var(--cursor-y,-40px),0); }
    .user-cursor-arrow { display:block;width:32px;height:30px;overflow:visible;transform:rotate(-14deg) scale(1);transform-origin:3px 2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.24));transition:transform 420ms cubic-bezier(.22,1,.36,1);will-change:transform; }
    .user-cursor-layer.is-pressed .user-cursor-arrow { transform:rotate(-14deg) scale(.92); }
    .user-cursor-tag-anchor { position:fixed;left:0;top:0;transform:translate3d(var(--label-x,-40px),var(--label-y,-40px),0) rotate(var(--label-tilt,0deg));transform-origin:left center; }
    .user-cursor-tag { display:block;width:58px;height:28px;transform:scale(1);transform-origin:left center;transition:transform 420ms cubic-bezier(.22,1,.36,1);will-change:transform; }
    .user-cursor-layer.is-pressed .user-cursor-tag { transform:scale(.92); }
    .user-cursor-logo { display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.24)); }
    @media(pointer:coarse){.user-cursor-layer{display:none!important}}
    .index { position:absolute; bottom:31px; left:clamp(24px,5.3vw,88px); font-size:10px; letter-spacing:.18em;color:rgba(255,255,255,.8); }
    @media(max-width:760px) {
      .hero { grid-template-columns:1fr; grid-template-rows:1fr auto; min-height:100svh; }
      .hero::before { background-position:55% center; }
      .hero::after { background:linear-gradient(90deg,rgba(70,46,96,.46),rgba(70,46,96,.08)),linear-gradient(0deg,rgba(65,41,89,.25),transparent 50%); }
      .topbar { height:68px; }.top-note{font-size:11px;letter-spacing:.12em}
      .brand { gap:6px; }.brand-logo { width:116px; height:44px; }.brand-icon { width:58px; height:46px; }
      .nav-panel { min-height:0; height:74svh; padding:106px 20px 8px calc(8vw + 18px); justify-content:center; }
      .eyebrow { margin-bottom:22px; font-size:10px; }
      .wheel { height:52svh; min-height:350px; max-height:470px; }
      .option { min-height:64px; font-size:clamp(29px,7.8vw,38px); }
      .nav-foot { margin-top:18px; font-size:10px; }
      .hero { grid-template-rows:1fr; }
      .nav-panel { height:74svh; padding-top:92px; }
      .scroll-hint { display:none }.index { bottom:23px; left:8vw; }
    }
    @keyframes brand-arrive { 0%{transform:translate3d(-56px,-10px,0) scale(.84);opacity:0} 68%{transform:translate3d(4px,1px,0) scale(1.035);opacity:1} 86%{transform:translate3d(-1px,0,0) scale(.995)} 100%{transform:translate3d(0,0,0) scale(1);opacity:1} }
    @keyframes mascot-arrive { 0%{transform:translate3d(-34px,28px,0) rotate(-10deg) scale(.76);opacity:0} 65%{transform:translate3d(3px,-4px,0) rotate(2.5deg) scale(1.08);opacity:1} 84%{transform:translate3d(-1px,1px,0) rotate(-.6deg) scale(.99)} 100%{transform:translate3d(0,0,0) rotate(0) scale(1);opacity:1} }
    @keyframes note-arrive { 0%{transform:translate3d(38px,0,0);opacity:0;letter-spacing:.34em} 72%{transform:translate3d(-3px,0,0);opacity:1} 100%{transform:translate3d(0,0,0);opacity:1;letter-spacing:.14em} }
    @keyframes copy-arrive { 0%{transform:translate3d(-42px,42px,0) scale(.9);opacity:0} 70%{transform:translate3d(3px,-4px,0) scale(1.025);opacity:1} 88%{transform:translate3d(-1px,1px,0) scale(.998)} 100%{transform:translate3d(0,0,0) scale(1);opacity:1} }
    @keyframes background-warp { 0%{transform:scale(1.24);opacity:0} 18%{opacity:.08} 42%{opacity:.35} 70%{opacity:.72} 100%{transform:scale(1.015);opacity:1} }
    @keyframes soft-exit { 0%{transform:scale(1.24);opacity:1} 18%{opacity:.92} 42%{opacity:.65} 70%{opacity:.28} 100%{transform:scale(1.015);opacity:0} }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}.brand-logo,.brand-icon,.top-note,.eyebrow,.nav-foot{animation-duration:520ms!important;animation-delay:0ms!important}.hero::before,.background-soft{animation-duration:1200ms!important}}
  </style>
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <filter id="liquid-lens" x="-12%" y="-18%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.055" numOctaves="1" seed="7" result="lens-map" />
      <feDisplacementMap in="SourceGraphic" in2="lens-map" scale="20" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <main class="hero" aria-label="莱茨狗 IP 展示首页">
    <div class="background-soft" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="laits-logo.png" alt="Laits 莱茨狗"><img class="brand-icon" src="laici-dog-head.png" alt="莱茨狗角色头像"></div>
      <div class="top-note">IP全案展示</div>
    </header>
    <section class="nav-panel" aria-label="内容导航">
      <p class="eyebrow">Let‘s gooooooooo！！！！！<br>够！再够就要够到大气层了</p>
      <div class="wheel" role="listbox" aria-label="IP内容导航" tabindex="0"></div>
      <div class="nav-foot">滚动 / 拖动 / 点击浏览</div>
    </section>
    <div class="index" id="index">01 / 09</div>
    <div class="scroll-hint"><span></span>SCROLL TO EXPLORE</div>
  </main>
  <div class="user-cursor-layer" id="user-cursor" aria-hidden="true">
    <span class="user-cursor-arrow-anchor"><svg class="user-cursor-arrow" viewBox="0 0 48 44" role="presentation"><path d="M8 2.8 Q5.8 2.1 4.7 4 Q4 5.2 5.1 7.1 L20.2 35 Q22.3 39.3 24.1 34.6 L26.4 24.7 Q27.1 21.8 29.7 20.1 L41.2 12.4 Q45.2 9.8 40.1 8.6 Z" fill="#fff" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /></svg></span>
    <span class="user-cursor-tag-anchor"><span class="user-cursor-tag" aria-label="莱茨狗 LOGO"><img class="user-cursor-logo" src="laits-logo.png" alt=""></span></span>
  </div>
  <script>
    (() => {
      const labels = ['IP介绍','角色四视图','场景延展','动作延展','表情延展','形象延展','材质延展','衍生周边','联名共创'];
      const wheel = document.querySelector('.wheel');
      const indexEl = document.querySelector('#index');
      let position = 0, target = 0, raf = 0, drag = null, lastSelected = 0;
      const itemScales=labels.map((_,i)=>i===0?1.1:1), scaleVelocities=labels.map(()=>0);
      const row = () => Math.min(84, Math.max(70, wheel.clientHeight / 8));
      const wrap = n => (n % labels.length + labels.length) % labels.length;
      const settle = () => { target = Math.max(0, Math.min(labels.length - 1, Math.round(target))); };
      labels.forEach((label,i) => {
        const el = document.createElement('div'); el.className = 'option'; el.textContent = label;
        el.setAttribute('role','option'); el.addEventListener('click', () => { target = i; });
        const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const restingOpacity=Math.max(.14,1-Math.abs(i-position)*.22);
        try {
          const entrance=el.animate([
            {translate:reduceMotion ? '-24px 22px' : '-58px 54px',scale:reduceMotion ? .98 : .86,opacity:0,offset:0},
            {translate:reduceMotion?'0 -1px':'4px -8px',scale:reduceMotion?1:1.035,opacity:restingOpacity,offset:.72},
            {translate:'-1px 1px',scale:.998,opacity:restingOpacity,offset:.9},
            {translate:'0 0',scale:1,opacity:restingOpacity,offset:1}
          ],{duration:reduceMotion?620:1320,delay:reduceMotion?80+i*34:340+i*90,easing:'cubic-bezier(.2,.82,.22,1)',fill:'both'});
          entrance.onfinish=()=>entrance.cancel();
        } catch (_) { /* Keep the wheel usable if Web Animations API is unavailable. */ }
        el.addEventListener('pointermove', e => {
          const rect=el.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
          const edge=Math.max(Math.abs(x-rect.width/2)/(rect.width/2),Math.abs(y-rect.height/2)/(rect.height/2))*100;
          const angle=(Math.atan2(y-rect.height/2,x-rect.width/2)*180/Math.PI+90+360)%360;
          el.style.setProperty('--glow-strength',String(Math.min(1,.55+edge/220)));
          el.style.setProperty('--cursor-angle',`${angle}deg`);
          el.style.setProperty('--pointer-x',`${x}px`);
          el.style.setProperty('--pointer-y',`${y}px`);
          el.classList.add('glowing');
        });
        el.addEventListener('pointerleave',()=>{el.style.setProperty('--glow-strength','0');el.style.setProperty('--pointer-x','50%');el.style.setProperty('--pointer-y','50%');el.classList.remove('glowing')});
        wheel.append(el);
      });
      const paint = () => {
        position += (target - position) * .16;
        if (Math.abs(target-position)<.001) position=target;
        const mid = wheel.clientHeight/2, spacing=row();
        const selected=Math.round(position);
        if(selected!==lastSelected){scaleVelocities[selected]=.06;lastSelected=selected}
        [...wheel.children].forEach((el,i) => {
          const d=i-position, angle=d*.22, y=Math.sin(angle)*spacing/.22;
          const x=(1-Math.cos(angle))*190;
          const scaleTarget=i===selected?1.1:1;
          scaleVelocities[i]+=(scaleTarget-itemScales[i])*.14;
          scaleVelocities[i]*=.62;
          itemScales[i]+=scaleVelocities[i];
          el.style.transform=`translate(${x}px, calc(-50% + ${y}px)) rotate(${d*10}deg) scale(${itemScales[i]})`;
          el.style.opacity=String(Math.max(.14,1-Math.abs(d)*.22));
          el.style.filter=`blur(${Math.min(16,Math.abs(d)*2.8)}px)`;
          el.classList.toggle('active',selected===i);
          el.setAttribute('aria-selected',selected===i?'true':'false');
        });
        indexEl.textContent=`${String(Math.round(position)+1).padStart(2,'0')} / 09`;
        raf=requestAnimationFrame(paint);
      };
      const change = n => { target=Math.max(0,Math.min(labels.length-1,n)); };
      wheel.addEventListener('wheel',e=>{e.preventDefault(); change(Math.round(target)+Math.sign(e.deltaY));},{passive:false});
      wheel.addEventListener('keydown',e=>{ if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();change(Math.round(target)+1)} if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();change(Math.round(target)-1)} });
      wheel.addEventListener('pointerdown',e=>{drag={y:e.clientY,start:target,moved:false};wheel.classList.add('dragging');wheel.setPointerCapture(e.pointerId)});
      wheel.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;if(Math.abs(dy)>4)drag.moved=true;if(drag.moved)target=Math.max(0,Math.min(labels.length-1,drag.start-dy/row()))});
      const end=()=>{if(drag?.moved)settle();drag=null;wheel.classList.remove('dragging')};
      wheel.addEventListener('pointerup',end);wheel.addEventListener('pointercancel',end);
      window.addEventListener('resize',()=>{});
      cancelAnimationFrame(raf); paint();
    })();
    (() => {
      if (window.matchMedia('(pointer: coarse)').matches) return;
      const layer=document.querySelector('#user-cursor');
      const html=document.documentElement;
      const position={x:{value:0,velocity:0},y:{value:0,velocity:0},labelX:{value:0,velocity:0},labelY:{value:0,velocity:0}};
      const target={x:0,y:0};
      let ready=false,active=false,raf=0,lastFrame=0;
      const moveSpring=(state,destination,dt,stiffness,damping,mass)=>{
        const acceleration=((destination-state.value)*stiffness-state.velocity*damping)/mass;
        state.velocity+=acceleration*dt;
        state.value+=state.velocity*dt;
      };
      const render=now=>{
        raf=0;
        if(!active)return;
        const dt=Math.min(.032,Math.max(.001,(now-lastFrame)/1000||.016));lastFrame=now;
        moveSpring(position.x,target.x,dt,380,32,.6);
        moveSpring(position.y,target.y,dt,380,32,.6);
        moveSpring(position.labelX,target.x+27,dt,220,26,.7);
        moveSpring(position.labelY,target.y+10,dt,220,26,.7);
        const speed=Math.hypot(position.x.velocity,position.y.velocity);
        const tilt=Math.max(-8,Math.min(8,(position.labelX.velocity-position.labelY.velocity)*.035));
        html.style.setProperty('--cursor-x',`${position.x.value.toFixed(2)}px`);
        html.style.setProperty('--cursor-y',`${position.y.value.toFixed(2)}px`);
        html.style.setProperty('--label-x',`${position.labelX.value.toFixed(2)}px`);
        html.style.setProperty('--label-y',`${position.labelY.value.toFixed(2)}px`);
        html.style.setProperty('--label-tilt',`${tilt.toFixed(2)}deg`);
        if(Math.abs(target.x-position.x.value)>.12||Math.abs(target.y-position.y.value)>.12||speed>.12||Math.abs(target.x+27-position.labelX.value)>.12||Math.abs(target.y+10-position.labelY.value)>.12){raf=requestAnimationFrame(render)}
      };
      const schedule=()=>{if(!raf){lastFrame=performance.now();raf=requestAnimationFrame(render)}};
      const hide=()=>{active=false;html.classList.remove('has-user-cursor');layer.classList.remove('is-visible','is-pressed')};
      window.addEventListener('pointermove',event=>{
        if(event.pointerType==='touch')return;
        target.x=event.clientX;target.y=event.clientY;
        if(!ready){position.x.value=target.x;position.y.value=target.y;position.labelX.value=target.x+27;position.labelY.value=target.y+10;ready=true}
        active=true;html.classList.add('has-user-cursor');layer.classList.add('is-visible');schedule();
      },{passive:true});
      window.addEventListener('pointerdown',()=>layer.classList.add('is-pressed'),{passive:true});
      window.addEventListener('pointerup',()=>layer.classList.remove('is-pressed'),{passive:true});
      window.addEventListener('pointercancel',()=>layer.classList.remove('is-pressed'),{passive:true});
      window.addEventListener('blur',hide);
      window.addEventListener('keydown',hide,{passive:true});
      document.addEventListener('visibilitychange',()=>{if(document.hidden)hide()});
    })();
  </script>
</body>
</html>
